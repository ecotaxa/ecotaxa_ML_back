[tox]
envlist = py38
skipsdist = True

[testenv]
deps = -rrequirements-dev.txt
setenv = PYTHONPATH = {env:PYTHONPATH:}{:}src
passenv = POSTGRES_HOST,POSTGRES_PORT
allowlist_externals =
    coverage
commands =
    mypy src
    coverage erase
    coverage run -m pytest
    coverage report --omit='.tox/*'
    coverage html --omit='.tox/*'
    coverage xml --omit='.tox/*' -o coverage.xml
